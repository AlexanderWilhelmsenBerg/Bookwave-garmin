name: Garmin Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-verification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app boundaries and contracts
        run: bash tools/ci/guardrails.sh

      - name: Verify signed-in Sidecar session exchange
        run: node --test sidecar/*.test.mjs

  compile:
    name: Compile ${{ matrix.app }} (${{ matrix.device }})
    needs: guardrails
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [companion, audio-provider]
        device:
          - fenix843mm
          - fenix847mm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          # Keep the output directory owned by the runner before the root Docker compiler writes files.
          mkdir -p out
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt
          rm developer_key.pem
          chmod 600 developer_key.der

      - name: Compile target app
        uses: blackshadev/garmin-connectiq-build-action@7f92305153c18b024c9cb02206145ba2415abbb2
        with:
          projectJungle: apps/${{ matrix.app }}/monkey.jungle
          developerKey: developer_key.der
          outputPath: out/BookWave-${{ matrix.app }}-${{ matrix.device }}.prg
          device: ${{ matrix.device }}
          typeCheck: "1"



      - name: Record development build identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.app }}" = "audio-provider" ]; then
            cp apps/audio-provider/third-party/WATCHSHELF-LICENSE.txt out/WATCHSHELF-LICENSE.txt
            cp apps/audio-provider/third-party/PROVENANCE.md out/PROVENANCE.md
          fi
          printf 'source=%s\ntarget=%s\nsigning=temporary-ci-development-key\n' "${{ github.sha }}" "${{ matrix.device }}" > out/BUILD-INFO.txt
          openssl pkey -inform DER -in developer_key.der -pubout | openssl dgst -sha256 >> out/BUILD-INFO.txt
          find out -maxdepth 1 -type f \( -name '*.prg' -o -name '*.iq' \) -exec sha256sum {} + >> out/BUILD-INFO.txt


      - name: Retain BookWave-${{ matrix.app }}-${{ matrix.device }} for acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BookWave-${{ matrix.app }}-${{ matrix.device }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  unit-test-compile:
    strategy:
      matrix:
        app: [companion, audio-provider]
    name: Compile Run No Evil tests (${{ matrix.app }})
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          # Keep the output directory owned by the runner before the root Docker compiler writes files.
          mkdir -p out
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt
          rm developer_key.pem
          chmod 600 developer_key.der

      - name: Compile test-enabled app
        uses: blackshadev/garmin-connectiq-build-action@7f92305153c18b024c9cb02206145ba2415abbb2
        with:
          projectJungle: apps/${{ matrix.app }}/monkey.jungle
          developerKey: developer_key.der
          outputPath: out/BookWave-${{ matrix.app }}-Tests-fenix847mm.prg
          device: fenix847mm
          typeCheck: "1"
          extraArgs: "--unit-test"



      - name: Record development build identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.app }}" = "audio-provider" ]; then
            cp apps/audio-provider/third-party/WATCHSHELF-LICENSE.txt out/WATCHSHELF-LICENSE.txt
            cp apps/audio-provider/third-party/PROVENANCE.md out/PROVENANCE.md
          fi
          printf 'source=%s\ntarget=%s\nsigning=temporary-ci-development-key\n' "${{ github.sha }}" "fenix847mm-unit-tests" > out/BUILD-INFO.txt
          openssl pkey -inform DER -in developer_key.der -pubout | openssl dgst -sha256 >> out/BUILD-INFO.txt
          find out -maxdepth 1 -type f \( -name '*.prg' -o -name '*.iq' \) -exec sha256sum {} + >> out/BUILD-INFO.txt


      - name: Retain BookWave-${{ matrix.app }}-Tests-fenix847mm for acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BookWave-${{ matrix.app }}-Tests-fenix847mm-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  package:
    strategy:
      matrix:
        app: [companion, audio-provider]
    name: Export ${{ matrix.app }} package
    needs:
      - guardrails
      - compile
      - unit-test-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          # Keep the output directory owned by the runner before the root Docker compiler writes files.
          mkdir -p out
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt
          rm developer_key.pem
          chmod 600 developer_key.der

      - name: Export Connect IQ package
        uses: blackshadev/garmin-connectiq-release-action@d7a4a7a5758147469d4f70a8e32c0165e8441103
        with:
          projectJungle: apps/${{ matrix.app }}/monkey.jungle
          developerKey: developer_key.der
          outputPath: out/BookWave-${{ matrix.app }}.iq


      - name: Record development build identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.app }}" = "audio-provider" ]; then
            cp apps/audio-provider/third-party/WATCHSHELF-LICENSE.txt out/WATCHSHELF-LICENSE.txt
            cp apps/audio-provider/third-party/PROVENANCE.md out/PROVENANCE.md
          fi
          printf 'source=%s\ntarget=%s\nsigning=temporary-ci-development-key\n' "${{ github.sha }}" "connect-iq-package" > out/BUILD-INFO.txt
          openssl pkey -inform DER -in developer_key.der -pubout | openssl dgst -sha256 >> out/BUILD-INFO.txt
          find out -maxdepth 1 -type f \( -name '*.prg' -o -name '*.iq' \) -exec sha256sum {} + >> out/BUILD-INFO.txt


      - name: Retain BookWave-${{ matrix.app }}-package for acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BookWave-${{ matrix.app }}-package-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
